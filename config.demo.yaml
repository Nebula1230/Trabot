# ─────────────────────────────────────────────────────────────────
# Demo Trading Configuration
# ─────────────────────────────────────────────────────────────────
# 1. Open MetaTrader 5 on your PC and log in to a DEMO account.
# 2. Fill in mt5.login, mt5.password, mt5.server below.
# 3. Run:  python run_demo.py
# ─────────────────────────────────────────────────────────────────
#
# ┌─ PROFILES ─────────────────────────────────────────────────────┐
# │  safe     — tight filters, tiny risk, few trades               │
# │  balanced — default (settings below apply as-is)               │
# │  risky    — looser filters, more positions, larger risk         │
# │  scalp    — 1-minute cycle on US30/US500/USTEC/DAX;            │
# │             fast in-and-out trades using ScalpingAgent.         │
# │             Symbols, interval and agent weights are ALL         │
# │             overridden automatically by the profile.            │
# │                                                                 │
# │  Usage:  python run_demo.py --live --profile scalp              │
# └─────────────────────────────────────────────────────────────────┘

# ── Symbols to trade ─────────────────────────────────────────────
# Use the exact symbol name your broker uses (check MT5 Market Watch).
# Forex examples: EURUSD, GBPUSD, USDJPY, XAUUSD (gold)
# Stocks:         NASDAQ:NVDA, NASDAQ:MSFT
symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCHF
  - AUDUSD
  - USDCAD
  - NZDUSD
  # - XAUUSD   # DISABLED — gold is too volatile for D1-based profiles (safe/balanced/risky).
  #              Only trade gold via the scalp profile (1m ATR-based tight SL).
  #              Uncomment here ONLY if you understand the risk and have a funded account.
  # ── Indices (CFDs) ──────────────────────────────────────────────
  - US30      # Dow Jones
  - US500     # S&P 500
  - USTEC     # Nasdaq 100
  - DAX       # Germany 40
  - UK100     # FTSE 100
  #
  # ── Optional additional symbols (uncomment to enable) ───────────
  # Verify each name in your broker's Market Watch; some brokers append
  # a suffix (e.g. EURUSD. or EURUSDm) or use a different name.
  #
  # Silver (spot):
  # - XAGUSD
  #
  # Asia-Pacific equity indices (CFDs):
  # - AUS200    # ASX 200 (Australia) — commodity-heavy, AUD-correlated
  # - JP225     # Nikkei 225 (Japan)  — export-driven, USDJPY-correlated
  #
  # ── JPY crosses (risk-on / carry) ─────────────────────────────
  - EURJPY    # EUR vs JPY — risk-on, VIX-driven
  - GBPJPY    # GBP vs JPY — high-beta risk-on
  - AUDJPY    # AUD vs JPY — purest risk-on barometer
  #
  # ── EUR crosses (relative macro) ────────────────────────────────
  - EURGBP    # EUR vs GBP — EU/UK relative macro
  - EURCHF    # EUR vs CHF — EU vs safe-haven franc
  - CHFJPY    # CHF vs JPY — dual safe-haven pair
  #
  # ── Silver ───────────────────────────────────────────────────────
  - XAGUSD    # Silver spot
  #
  # Energy (CFDs — check broker symbol name):
  # - USOIL     # WTI Crude Oil  (some brokers use XTIUSD)
  # - XTIUSD    # WTI Crude Oil  (alternative name)

# ── Cycle interval ───────────────────────────────────────────────
# How often (seconds) the bot re-analyses all symbols for NEW entries.
# 3600 = once per hour  |  900 = every 15 min  |  300 = every 5 min
interval_seconds: 300

# ── Real-time surveillance ─────────────────────────────────
# A separate fast loop watches open positions independently of the signal loop.
# It runs SL lock-in (break-even/trail) and agent-based exit checks.
# Also handles Friday weekend gap protection (weekend_close_enabled).
realtime:
  surveillance_interval_seconds: 60   # check open positions every 60s
  weekend_close_enabled:     true
  weekend_close_utc_hour:    20        # 20:00 UTC = after London session, before Asian open

# ── MT5 connection ───────────────────────────────────────────────
# Running on Linux?  Start the mt5docker container first:
#   docker compose up -d
# Then set host/port below to reach it.
# Running on Windows with the native MT5 terminal?
#   Set host: "" (empty) — the official MetaTrader5 package is used automatically.
mt5:
  host:     "localhost"          # Docker host
  port:     18812                # mt5linux API port (mt5linux default)
  login:    5048478471           # ← your MT5 demo account number
  password: "Wu_wS1Lq"          # ← your MT5 demo password
  server:   "MetaQuotes-Demo"    # ← broker server name, e.g. "ICMarkets-Demo"
  magic_number: 434242           # unique ID so the bot only manages its own orders
  slippage: 10                   # max slippage in points
  # Spread guard: refuse entry if spread exceeds this fraction of the planned stop distance.
  # 0.20 = skip if spread > 20% of stop (instrument-agnostic: works for forex AND indices).
  # EURUSD normal spread=3 pts ≈ 1.9% of a 16-pip stop → allowed.
  # US30 normal spread=210 pts ≈ 0.5% of a 400-pt stop → allowed.
  # If EURUSD spikes to 10 pips during news ≈ 31% of stop → blocked.
  max_spread_fraction: 0.20

# ── Risk management ──────────────────────────────────────────────
# Forex-safe defaults: small risk per trade, leverage kept low
risk:
  base_risk_pct:            0.10   # risk 0.10% of equity per trade (Forex = leveraged!)
  max_daily_drawdown_pct:   1.0    # halt if daily loss exceeds 1%
  # Weekly circuit breaker: let the bot lose up to 2% in a week before halting
  # all new entries.  Prevents 5× small daily losses from compounding silently.
  # 0 = disabled.
  max_weekly_drawdown_pct:  2.0
  max_concurrent_trades:    6      # max open positions
  per_symbol_leverage_cap:  3.0
  portfolio_leverage_cap:   5.0
  # Forex correlation guard: max positions in the same USD direction
  # (e.g. SHORT EURUSD + SHORT GBPUSD = 2 × long USD).  Set to 0 to disable.
  max_correlated_positions: 2
  # Weekly pivot level proximity guard — reject entries directly into a key level.
  # 0.50 = reject if opposing pivot is closer than 0.5×ATR.  Set 0 to disable.
  pivot_buffer_atr: 0.50
  # Overtrading guards: balanced has 21 symbols on a 5-min cycle.
  # Without caps the bot can place trade after trade on hot symbols.
  entry_cooldown_minutes: 15    # min 15 min between entries on same symbol
  max_daily_trades:       20    # hard daily cap across all symbols

# ── Agent tuning (optional) ───────────────────────────────────────
# Leave empty to use all agents with equal weight.
agents:
  enabled_agents: []   # empty = all 7 enabled
  agent_weights:
    RegimeAgent:          1.0
    TrendAgent:           1.0
    MomentumAgent:        1.0
    MeanReversionAgent:   1.0
    VolatilityAgent:      1.0
    BreadthAgent:         1.0
    PatternAgent:         1.0
    # ── New forex-specific agents ──────────────────────────────
    # IntermarketAgent: macro context (DXY, VIX, crude, yields via yfinance).
    # Set weight < 1 initially so it confirms rather than overrides price structure.
    IntermarketAgent:     0.80
    # SessionBreakoutAgent: London open Asian-range breakout pattern (H1 bars).
    SessionBreakoutAgent: 0.70
    # DivergenceAgent: RSI divergences — reversal & continuation setups (1H bars).
    DivergenceAgent:      0.80

# ── Alignment thresholds ─────────────────────────────────────────
# Controls how strongly signals must agree before a trade is placed.
alignment:
  long_min_score:   0.20   # min directional score on long timeframe (D1)  [raised from 0.12 — near-noise; risky=0.18, safe=0.35]
  mid_min_score:    0.10   # min directional score on mid timeframe (1H)
  short_min_score:  0.08   # min directional score on short timeframe (15m)
  mean_rev_guard:   0.65   # block if mean-reversion score > this (overbought check)
  breadth_min:     -0.60   # block if market breadth below this (weak market)
  min_win_prob:     0.52   # min win probability required  [raised: formula baseline ~0.58 so 0.48 was never blocking anything]
  min_ev:           0.15   # min expected value required  [raised: 0.10 was below typical formula output for any aligned signal]
  min_confidence:   0.50   # agent confidence gate [raised from 0.46 — filter weak 1m signals]
  pullback_tolerance: 0.20  # tightened from 0.40 — dir_mid/short at -0.39 is near-opposed, not a pullback
  # ── Forex session dead-zone (UTC hours) — thresholds tightened to avoid low-liquidity entries
  dead_zone_start_utc: 22   # 22:00 UTC = London/NY close
  dead_zone_end_utc:    6   # 06:00 UTC = before London open
  dead_zone_factor:   1.40  # multiply all thresholds by this during dead zone
  # ── Agent consensus gate ── require minimum agents to agree before trading
  # Excludes BreadthAgent (market context filter).  With 10 directional agents
  # (9 original + DivergenceAgent) a value of 5 requires majority agreement.
  min_agent_consensus:      6     # minimum agents voting in trade direction [raised from 5 — fewer but higher-quality entries]
  consensus_vote_threshold: 0.05  # minimum |dir_score| to count as a vote

# ── Scale-in (pyramiding) ─────────────────────────────────────────
# Allows adding a second position on the same symbol when the signal
# is unusually strong (full-alignment only) and the existing trade is
# already profitable.
scale_in:
  enabled:                  true   # set false to disable entirely
  max_positions_per_symbol: 2      # hard cap: max 2 entries per symbol
  require_profit:           true   # only scale into winning positions
  risk_fraction:            0.5    # scale-in uses 50% of normal risk
  sl_atr_multiplier:        1.0    # tighter stop: 1×ATR (vs normal 2×ATR)
# ── Exit rules — proactive trade cancellation ──────────────────────────
# Three conditions are evaluated every cycle for each open position:
#  1. D1 flip: D1 trend reversed against trade (always active, uses long_min_score)
#  2. Conviction fade: D1 score drops near zero — trend has evaporated
#  3. Mid+Short opposition: 1H and 15m both strongly contradict the trade
# Plus: soft-tighten when conviction is weakening but not yet at close threshold.
exit_rules:
  conviction_fade_enabled:          true
  conviction_fade_threshold:        0.05   # close if |D1| < this [lowered from 0.10 — 1m wiggles kept triggering at 0.10]
  mid_short_opposition_enabled:     true
  mid_short_opposition_threshold:   0.50   # close if BOTH M & S exceed this [raised from 0.35 — less hair-trigger on 1m noise]
  # Tighten SL/TP when signal is weakening (between fade and tighten thresholds)
  # instead of waiting to either fully close or do nothing:
  tighten_on_fade_enabled:          true
  tighten_fade_threshold:           0.12   # tighten when fade_threshold < |D1| < this [raised from 0.20 — wider window before tightening]
  tighten_tp_atr_mult:              0.5    # new TP = price ± N×ATR (capture nearby profit)
  # Time-stop: close any trade open longer than this without reaching TP.
  # Prevents capital being locked in stalled/sideways trades paying swap.
  # 0 = disabled.  Balanced default: 10h (D1 signal — 10h without move = thesis failed).
  max_trade_duration_hours:         10

# ── Execution freshness guards ───────────────────────────────────
# Reject entries when the signal or last market tick is too old.
execution:
  signal_max_age_seconds: 150  # reject plan if bar data is older than this (s); 0=disabled
  max_tick_age_ms: 2000        # reject entry if last MT5 tick is older than this (ms); 0=disabled
  # Pre-news blackout: skip new entries within ±N minutes of a high-impact economic
  # event (NFP, FOMC, CPI) for any currency in the traded symbol.  Data from
  # ForexFactory public JSON (cached 4h, fault-tolerant — disabled if unreachable).
  # 0 = disabled.
  news_blackout_minutes: 20

# ── Weekend gap protection ──────────────────────────────────────────────
# Moved into the realtime: block above (YAML does not allow duplicate top-level keys).

# ── Trailing stop — staged lock-in + TP management ────────────────
# Stage 1 (+1R profit):  SL → break-even
# Stage 2 (+1.5R profit): SL → entry + 0.5R
# Stage 3 (+2R profit):  SL → ATR trail  AND  TP → pushed forward automatically
trailing:
  atr_multiplier:      1.5    # Stage-3 SL trail distance = price ± N×ATR
  tp_extend_enabled:   true   # push TP forward in Stage 3 (let winners run)
  tp_extend_atr_mult:  2.0    # new TP = price ± N×ATR when extending
  # Partial take-profit: close a fraction of the position the first time
  # price hits +1R (break-even), then trail the remaining lot.
  # This banks a guaranteed gain and removes psychological pressure
  # while the trailing SL rides the rest of the move.
  partial_tp_enabled:  true
  partial_tp_fraction: 0.50   # close 50% at +1R; trail the other 50%
  partial_tp2_enabled:  true
  partial_tp2_r_mult:   2.0   # fire 2nd partial when profit reaches +2R
  partial_tp2_fraction: 0.40  # close 40% of remaining at +2R
  windfall_exit_enabled: true
  windfall_r_mult:      3.5   # close ALL when profit reaches +3.5R

# ── Regime-conditional agent weighting ───────────────────────────
# In trending regimes (ADX > ~28, trendiness > trend_threshold), amplify
# trend-following agents and reduce mean-reversion agents — and vice versa.
# The transition is soft: full amplification only at the extreme of each regime.
# Individual multipliers are defined as class constants in TradingGraph.
regime_weighting:
  trend_threshold: 0.55   # trendiness above this = trending regime
  range_threshold: 0.40   # trendiness below this = ranging regime

# ── VIX-based risk scaling ────────────────────────────────────────
# Reduce position size when macro fear is elevated (VIX high/rising fast).
# Risk is ONLY reduced, never increased above base_risk_pct.
# vix_fear is the magnitude of the VIX signal pre-mapped for this symbol
# by IntermarketAgent (0..1 scale).
vix_risk_scaling:
  enabled:   true
  threshold: 0.40   # start reducing below this |vix| magnitude  (0.40 ≈ VIX ~26)
  floor:     0.50   # minimum allowed fraction of base risk       (0.50 = halved at max fear)

# ── Kelly criterion adaptive position sizing ────────────────────
# Scales position size up/down based on per-symbol closed-trade history.
# Uses half-Kelly for safety.  Requires min_trades before adjusting.
kelly:
  enabled:       true
  half_kelly:    true    # recommended: use half of theoretical optimum
  min_trades:    20      # history needed before adjusting size
  max_mult:      1.75    # cap multiplier (prevents over-exposure on lucky streaks)
  min_mult:      0.60    # floor multiplier (still trades but reduced on poor history)
  lookback_days: 60      # MT5 history window for computing stats

# ── Adaptive agent weight learning ──────────────────────────────
# Adjusts each agent's fusion weight based on its closed-trade hit rate.
# Agents that vote correctly more often than chance get more influence;
# agents that vote incorrectly get less.  Changes are gradual (Bayesian
# shrinkage) and always stay within [base×min_mult, base×max_mult].
#
# Formula:
#   hit_edge  = hit_rate − 0.50          (excess accuracy above chance)
#   shrinkage = n / (n + shrink_n)       (Bayesian prior pull; builds to 1)
#   new_w     = base_w × (1 + sensitivity × hit_edge × shrinkage)
#   new_w     = clamp(new_w, base_w×min_mult, base_w×max_mult)
#
# Example: sensitivity=2.0, hit_rate=0.60 (+10pp edge), n=60, shrink_n=60
#   shrinkage = 0.50, hit_edge = 0.10
#   new_w = base × (1 + 2.0 × 0.10 × 0.50) = base × 1.10  (+10%)
#
adaptive_weights:
  enabled:               true    # ← enabled
  sensitivity:           2.0      # hit_rate edge amplification factor (1.0–4.0)
  min_trades:            30       # minimum closed trades before adjusting weight
  max_mult:              2.50     # cap: never more than 2.5× base weight
  min_mult:              0.40     # floor: never less than 40% of base weight
  shrink_n:              60       # Bayesian shrinkage: "N trades = 50% confidence"
  update_interval_hours: 4.0      # recompute weights at most every N hours
  log_updates:           true     # log weight changes at INFO level

# ── Journal / logging ────────────────────────────────────────────
journal:
  log_dir: "logs"          # folder where trade logs are written
  log_decisions: true      # log every signal cycle (even non-trades)
  log_trades:    true      # log every executed order

# ── LLM Agent Bridge (optional) ──────────────────────────────────
# Plugs the TradingAgentsGraph LLM pipeline (tradingagents package)
# as an additional LONG-timeframe overlay agent.  Off by default.
#
# Requirements:
#   pip install langchain-openai langchain-anthropic langgraph
#   export OPENAI_API_KEY="sk-..."   # or set via .env
#   The `tradingagents` folder must be on PYTHONPATH (already in this repo).
#
# Score mapping:  BUY → +0.70  |  HOLD → 0.00  |  SELL → −0.70
# The LLM score is fused with TA agents on the LONG timeframe tier.
# Set weight > 1.0 to give it more influence (e.g. 2.0 = twice a normal agent).
#
llm_agents:
  enabled:        false          # ← set to true to activate

  # Path to the cloned TauricResearch/TradingAgents repo.
  # git clone https://github.com/TauricResearch/TradingAgents
  upstream_path:  /home/hkerroum/Documents/proj/scale/finbo/TradingAgents

  # ── Analyst modules ──────────────────────────────────────────────────────────
  analysts:                      # load a subset for faster cycles
    - market                     #   technical indicators via yfinance/stockstats
    - news                       #   global news via Finnhub / Google News
  # optional additions:
  #   - social                   #   Reddit/social sentiment (slower, equities)
  #   - fundamentals             #   balance sheet, insider activity (equities)

  # ── Throttle & weight ────────────────────────────────────────────────────────
  throttle_hours: 4.0            # re-run at most every N hours per symbol
  weight:         1.0            # agent weight in fusion (1.0 = one standard agent)

  # ── Reliability / circuit breaker ───────────────────────────────────────────
  timeout_seconds:     120       # hard wall-clock cap (seconds) per call
  max_retries:         2         # retries on transient errors (5s / 10s / 20s back-off)
  cb_fail_threshold:   3         # consecutive failures before opening circuit breaker
  cb_cooldown_minutes: 15.0      # minutes in OPEN state before half-open probe

  # ── Cloud providers ──────────────────────────────────────────────────────────
  llm_provider:    openai        # openai | anthropic | google | xai | openrouter
  deep_think_llm:  gpt-4o-mini
  quick_think_llm: gpt-4o-mini
  backend_url:     ""            # leave blank to use provider default

